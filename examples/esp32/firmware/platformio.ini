[platformio]
default_envs = esp32wroom

[env:esp32wroom]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
extra_scripts = pre:link_probe.py

[env:esp32c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
extra_scripts = pre:link_probe.py

[env:esp32c3-usb]
extends = env:esp32c3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 0
monitor_rts = 0
